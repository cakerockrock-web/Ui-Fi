name: Check Twitter Posts

on:
  schedule:
    # รันอัตโนมัติทุกๆ 10 นาที (สามารถปรับได้ตามต้องการ)
    - cron: '*/10 * * * *'
  workflow_dispatch: # เปิดให้กดรันมือได้

# อนุญาตให้บอทเขียนและ Push ไฟล์กลับเข้า Repository ได้
permissions:
  contents: write

jobs:
  check-twitter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Twitter Webhook Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python twitter_webhook.py

      - name: Commit and Push Last Tweet IDs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_tweet_ids.json
          git commit -m "Update last_tweet_ids.json [skip ci]" || exit 0
          git push
